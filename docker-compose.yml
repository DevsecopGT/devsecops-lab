services:
  app-flask:
    build: ./app
    image: ghcr.io/${GITHUB_REPOSITORY:-local/devsecops-lab}/app-flask:${IMAGE_TAG:-latest}
    container_name: app-flask
    restart: unless-stopped
    environment:
      FLASK_ENV: production
      DB_HOST: db-postgresql
      DB_NAME: flaskdb
      DB_USER: ${DBUSER_FLASK}
      DB_PASSWORD: ${DBPASS_FLASK}
      REDIS_HOST: redis-redis
      BASE_URL: ${BASE_URL:-http://localhost}
    depends_on:
      db-postgresql:
        condition: service_healthy
      redis-redis:
        condition: service_healthy
    expose:
      - "5000"
    networks:
      - backend

  db-postgresql:
    image: postgres:16
    container_name: db-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_DB: flaskdb
      POSTGRES_USER: ${DBUSER_FLASK}
      POSTGRES_PASSWORD: ${DBPASS_FLASK}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DBUSER_FLASK} -d flaskdb"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-redis:
    image: redis:7-alpine
    container_name: redis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  nginx-reverse-proxy:
    image: nginx:stable-alpine
    container_name: nginx-reverse-proxy
    restart: unless-stopped
    depends_on:
      - app-flask
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro,z
    networks:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  backend:
    driver: bridge
